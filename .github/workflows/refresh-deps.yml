name: Temporary dependency security refresh

on:
  push:
    branches: [chore/dependency-security-fix]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update vulnerable direct dependencies
        run: npm install --save-dev vite@6.4.4 vitest@4.1.12
      - name: Apply compatible transitive security fixes
        run: npm audit fix || true
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: update vulnerable build and test dependencies"
            git push origin HEAD:chore/dependency-security-fix
          fi
      - name: Verify high and critical advisories are resolved
        run: npm audit --audit-level=high
